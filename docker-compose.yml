version: "3.8"
services:
  plc_con:
      tty: true
      stdin_open: true
      image: myApp/v1.0/apps/plc_con:1.0.0
      container_name: plc_con
      volumes:
        - /home/xlee/docker/Config.json:/source/Config.json
      ports:
        - "5000:5000"
      environment:
        TZ: Asia/Seoul
      restart: no